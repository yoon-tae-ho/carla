# Default config for controllers.skyhook.SkyhookController.

controller_version: skyhook_v3_canonical
default_dt: 0.05
wheel_count: 4

# Geometry fallback. VehicleState angles are degrees and actor angular velocity
# is converted from deg/s to rad/s inside the controller by default.
half_wheelbase_m: 1.45
half_track_m: 0.85
front_x_sign: 1.0
left_y_sign: -1.0
angular_velocity_source: actor_getter_deg_s
angular_velocity_unit: deg_s
vertical_velocity_source: world_z

# State source and strict fallback.
require_suspension_state: true
identity_if_any_wheel_invalid: true
require_contact_valid: true
require_velocity: true
relative_extension_sign: -1.0

# Damper-only projected-force skyhook law.
skyhook_law: projected_force
skyhook_c_scale: 1.0
neutral_damper_scale: 1.0
low_damper_scale: 0.82
high_damper_scale: 1.22
min_damper_scale: 0.75
max_damper_scale: 1.25
max_damper_delta_per_step: 0.035

# Deadbands and safety.
sprung_velocity_deadband: 0.025
rel_velocity_deadband: 0.015
product_deadband: 0.0005
projection_eps: 0.000001

# Startup invalid velocity-cache rows are diagnostic-only and still command
# identity.
startup_prime_diagnostics_enabled: true
startup_prime_max_frames: 3
